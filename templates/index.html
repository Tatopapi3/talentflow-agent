<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalentFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header>
      <h1>TalentFlow</h1>
      <p class="tagline">Your AI resume-screening assistant</p>
    </header>

    <div class="robot-stage">
      <div class="robot" id="robot" data-state="idle">
        <svg viewBox="0 0 240 220" width="192" height="176" aria-hidden="true">
          <line x1="120" y1="10" x2="120" y2="32" stroke="#8fa6b8" stroke-width="4" stroke-linecap="round" class="antenna-rod"/>
          <circle id="antenna-tip" cx="120" cy="8" r="7"/>

          <rect id="arm-l" x="51" y="158" width="26" height="48" rx="13"/>
          <circle id="shoulder-l" cx="76" cy="164" r="15"/>
          <circle id="hand-l" cx="64" cy="206" r="14"/>
          <circle id="hand-l-shine" cx="59" cy="201" r="4" fill="#ffffff" opacity="0.55"/>

          <rect id="arm-r" x="163" y="158" width="26" height="48" rx="13"/>
          <circle id="shoulder-r" cx="164" cy="164" r="15"/>
          <circle id="hand-r" cx="176" cy="206" r="14"/>
          <circle id="hand-r-shine" cx="171" cy="201" r="4" fill="#ffffff" opacity="0.55"/>

          <rect id="body" x="75" y="150" width="90" height="55" rx="18"/>
          <circle id="chest-light" cx="120" cy="177" r="9"/>

          <rect id="head" x="50" y="30" width="140" height="120" rx="28"/>
          <rect id="head-shine" x="66" y="42" width="26" height="14" rx="7" fill="#ffffff" opacity="0.5"/>

          <g id="eyes"></g>

          <path id="mouth" d="M 95 118 Q 120 122 145 118" fill="none" stroke="#3a4a58" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="speech-bubble" id="speech">Ready when you are &mdash; paste a job description and a resume below.</div>
    </div>

    <form id="screen-form" class="panel">
      <label for="jd">Job description</label>
      <textarea id="jd" rows="6" placeholder="Paste the job description here..." required></textarea>

      <label for="resume">Resume</label>
      <textarea id="resume" rows="8" placeholder="Paste a candidate's resume here..." required></textarea>

      <button type="submit" id="submit-btn">Screen this resume</button>
    </form>

    <div id="results"></div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
