<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalentFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header>
      <h1>TalentFlow</h1>
      <p class="tagline">Your AI resume-screening assistant</p>
    </header>

    <div class="robot-stage">
      <div class="robot" id="robot" data-state="idle">
        <svg viewBox="0 0 200 220" width="160" height="176" aria-hidden="true">
          <line x1="100" y1="10" x2="100" y2="32" stroke="#8fa6b8" stroke-width="4" stroke-linecap="round" class="antenna-rod"/>
          <circle id="antenna-tip" cx="100" cy="8" r="7"/>

          <rect id="head" x="30" y="30" width="140" height="120" rx="28"/>
          <rect id="head-shine" x="46" y="42" width="26" height="14" rx="7" fill="#ffffff" opacity="0.5"/>

          <g id="eyes"></g>

          <path id="mouth" d="M 75 118 Q 100 122 125 118" fill="none" stroke="#3a4a58" stroke-width="5" stroke-linecap="round"/>

          <rect id="body" x="55" y="150" width="90" height="55" rx="18"/>
          <circle id="chest-light" cx="100" cy="177" r="9"/>
        </svg>
      </div>
      <div class="speech-bubble" id="speech">Ready when you are &mdash; paste a job description and a resume below.</div>
    </div>

    <form id="screen-form" class="panel">
      <label for="jd">Job description</label>
      <textarea id="jd" rows="6" placeholder="Paste the job description here..." required></textarea>

      <label for="resume">Resume</label>
      <textarea id="resume" rows="8" placeholder="Paste a candidate's resume here..." required></textarea>

      <button type="submit" id="submit-btn">Screen this resume</button>
    </form>

    <div id="results"></div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
